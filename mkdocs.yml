site_name: TDS ET Prep — May 2026
site_description: Student-built end-term prep for Tools in Data Science (T2-2026). Exam-pattern-first notes, PYQ solutions with reasoning, and practice questions.
site_url: ""

theme:
  name: material
  icon:
    logo: material/school
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - toc.follow
    - header.autohide
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/focus.js
  - javascripts/grade-calc.js

markdown_extensions:
  - admonition           # colored boxes: success / warning / danger / info / tip
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details     # collapsible solutions
  - pymdownx.superfences # nested code inside admonitions
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Plans: plan/index.md
  - Exam:
    - exam/index.md
    - What the ET looks like: exam/exam-pattern.md
    - Answers an LLM grades well: exam/llm-grading-guide.md
  - Learn:
    - learn/index.md
    - Week notes:
      - Bridge course: weeks/week-bridge.md
      - Week 1 — Tools & fundamentals: weeks/week-1.md
      - Week 2 — APIs & deployment: weeks/week-2.md
      - Week 3 — Prompting & LLMs: weeks/week-3.md
      - Week 4 — RAG: weeks/week-4.md
      - Week 5 — Agents: weeks/week-5.md
      - Week 6 — Scraping & extraction: weeks/week-6.md
      - Week 7 — Security & automation: weeks/week-7.md
      - Week 8 — ML platforms: weeks/week-8.md
    - Revision sessions:
      - ET-1: sessions/et-01.md
      - ET-2: sessions/et-02.md
      - ET-3: sessions/et-03.md
  - Revise:
    - revise/index.md
    - Cheat sheet: topics/cheat-sheet.md
    - Short notes:
      - Web & APIs: topics/web-apis.md
      - Docker & deployment: topics/docker-deployment.md
      - LLMs & prompting: topics/llm-prompting.md
      - RAG & agents: topics/rag-agents.md
      - Data & ML: topics/data-ml.md
      - Git, security & practices: topics/git-security.md
  - Practice:
    - PYQ solutions:
      - pyqs/index.md
      - T1-2026 AN — solved: pyqs/t1-2026-an.md
      - T1-2026 FN — solved: pyqs/t1-2026-fn.md
      - T3-2025 AN — solved: pyqs/t3-2025-an.md
      - T3-2025 FN — solved: pyqs/t3-2025-fn.md
    - Practice questions:
      - practice/index.md
      - New topics (W4-W8): practice/new-topics.md
      - Core patterns: practice/core-patterns.md
      - Short answers: practice/short-answers.md
  - Mock:
    - mock/index.md
    - Mock-2 (subjective half): mock/subjective.md
  - Calculator:
    - calculator/index.md
    - Grade estimator (before ET marks): calculator/estimator.md
    - Grade calculator (after ET marks): calculator/calculator.md
