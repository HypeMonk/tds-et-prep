site_name: TDS ET Prep — May 2026
site_description: Student-built end-term prep for Tools in Data Science (T2-2026). Exam-pattern-first notes, PYQ solutions with reasoning, and practice questions.
site_url: ""
repo_url: ""

# Light + dark theme, remembered across visits, follows system preference initially.
theme:
  name: material
  features:
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - admonition          # the colored boxes: note/tip/warning/danger
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details     # collapsible solutions
  - pymdownx.superfences # nested code in admonitions
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Exam:
    - exam/index.md
    - What the ET looks like: exam/exam-pattern.md
    - Writing answers an LLM grades well: exam/llm-grading-guide.md
